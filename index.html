<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL Arena Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap">
<style>
body{margin:0}
/* Layout: scoreboard header, person filter, full-width ice-sheet map, arena lists below */
:root{
  --ice:#eef3f7; --land:#ffffff; --water:#dbe6ee; --line:#9fb3c3; --ink:#14212c; --muted:#5d7080;
  --goal:#c8102e; --goal-soft:#fbe3e6; --blue:#1f4e8c; --pill:#ffffff;
  --p-rob:#0f8a7e; --p-dad:#c27c00; --p-kris:#7b4fc9; --p-michael:#8a5a2b;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ice:#0d1620; --land:#1a2633; --water:#0d1620; --line:#3c5164; --ink:#e7eef4; --muted:#93a6b6;
  --goal:#ff4d5e; --goal-soft:#3a1c24; --blue:#7fb0ef; --pill:#1a2633;
  --p-rob:#3fc7b8; --p-dad:#f2b13c; --p-kris:#b294f2; --p-michael:#d29a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --ice:#0d1620; --land:#1a2633; --water:#0d1620; --line:#3c5164; --ink:#e7eef4; --muted:#93a6b6;
  --goal:#ff4d5e; --goal-soft:#3a1c24; --blue:#7fb0ef; --pill:#1a2633;
  --p-rob:#3fc7b8; --p-dad:#f2b13c; --p-kris:#b294f2; --p-michael:#d29a62; color-scheme:dark}
body{background:var(--ice);color:var(--ink);font-family:var(--body);font-size:15px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,44px);letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1;text-wrap:balance}
h1 span{color:var(--goal)}
.score{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:grid;gap:6px;justify-items:end;text-align:right}
.score b{font-size:34px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0}
.ticks{display:grid;grid-template-columns:repeat(32,1fr);gap:3px;width:min(320px,100%)}
.tick{height:10px;border-radius:2px;background:var(--line);opacity:.45}
.tick.some{background:var(--goal);opacity:.35}
.tick.on{background:var(--goal);opacity:1}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .lbl{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:14px;margin-right:4px}
.chip{font:600 16px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--pill);color:var(--ink);cursor:pointer;min-height:36px}
.chip:hover{border-color:var(--blue)}
.chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--ice)}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7}
.map{background:var(--water);border:1px solid var(--line);border-radius:14px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.land{fill:var(--land);stroke:var(--line);stroke-width:.6}
.lake{fill:var(--water);stroke:var(--line);stroke-width:.6}
.mex{fill:var(--land);opacity:.45}
.states{fill:none;stroke:var(--line);stroke-width:.4;opacity:.7}
.border{fill:none;stroke:var(--blue);stroke-width:1.2;stroke-dasharray:4 3;opacity:.6}
.lead{stroke:var(--muted);stroke-width:.8}
.dot{fill:var(--ink)}
/* Logo badges: grey and faded until visited; red ring = all selected, dashed red = some */
.badge{fill:#fff;stroke:var(--line);stroke-width:1.2}
.logo{filter:grayscale(1);opacity:.45}
.who circle{stroke:var(--land);stroke-width:.8}
.mk.all .badge{stroke:var(--goal);stroke-width:2.6}
.mk.all .dot{fill:var(--goal)}
.mk.some .badge{stroke:var(--goal);stroke-width:2;stroke-dasharray:3.2 2.2}
.mk.all .logo,.mk.some .logo{filter:none;opacity:1}
.mk{cursor:default;outline:none}
.mk:hover .badge,.mk:focus .badge{stroke-width:3.2}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:13px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-3px;margin-right:6px;border:1.5px solid var(--line);background:#fff}
.legend i.all{border:2.5px solid var(--goal)}
.legend i.some{border:2px dashed var(--goal)}
.legend .pd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;align-items:start}
h2{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:16px;margin:0 0 8px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 40%,transparent);min-width:0}
.c{font-family:var(--display);font-weight:700;color:var(--blue);flex:none;display:flex;align-items:center;gap:8px;width:72px}
.c img{width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line);padding:2px;box-sizing:border-box}
li.none .c img{filter:grayscale(1);opacity:.5}
li.all .c,li.some .c{color:var(--goal)}
.t{min-width:0;flex:1}
.ppl{display:flex;gap:3px;flex:none;align-self:center}
.ppl b{font:700 11px/16px var(--display);width:16px;height:16px;border-radius:50%;text-align:center;color:#fff;background:var(--c)}
small{display:block;color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
</style>
</head>
<body>

<header>
  <h1>NHL Arena <span>Quest</span></h1>
  <div class="score"><span><b id="count">0</b> / 32 arenas</span><span id="scope"></span><div class="ticks" id="ticks"></div></div>
</header>
<div class="filters" role="group" aria-label="Filter by person"><span class="lbl">Show</span><span id="chips"></span></div>

const NS="http://www.w3.org/2000/svg";
const el=(tag,attrs={},parent,text)=>{const n=tag.startsWith("svg:")?document.createElementNS(NS,tag.slice(4)):document.createElement(tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(text!=null)n.textContent=text;if(parent)parent.appendChild(n);return n};
const has=(p,code)=>p.visits.includes(code);
const logo=a=>`https://assets.nhle.com/logos/nhl/svg/${a.code}_light.svg`;
const color=p=>`var(--p-${p.id})`;

let selected=new Set(PEOPLE.map(p=>p.id));
function readHash(){
  const ids=location.hash.slice(1).split("+").filter(id=>PEOPLE.some(p=>p.id===id));
  selected=new Set(ids.length?ids:PEOPLE.map(p=>p.id));
}
function writeHash(){
  const all=selected.size===PEOPLE.length;
  history.replaceState(null,"",all?location.pathname+location.search:"#"+PEOPLE.filter(p=>selected.has(p.id)).map(p=>p.id).join("+"));
}
const sel=()=>PEOPLE.filter(p=>selected.has(p.id));
function status(a){
  const who=sel().filter(p=>has(p,a.code));
  return {who,state:who.length&&who.length===selected.size?"all":who.length?"some":"none"};
}
function joinNames(ps){const n=ps.map(p=>p.name);return n.length<2?n[0]:n.slice(0,-1).join(", ")+" & "+n.at(-1)}

function renderChips(){
  const box=document.getElementById("chips");box.textContent="";box.style.display="contents";
  const everyone=el("button",{class:"chip",type:"button","aria-pressed":selected.size===PEOPLE.length},box,"Everyone");
  everyone.onclick=()=>{selected=new Set(PEOPLE.map(p=>p.id));update()};
  for(const p of PEOPLE){
    const b=el("button",{class:"chip",type:"button","aria-pressed":selected.has(p.id)&&selected.size<PEOPLE.length,style:`--c:${color(p)}`},box);
    el("span",{class:"sw"},b);el("span",{},b,p.name);el("span",{class:"n"},b,p.visits.length);
    b.onclick=()=>{
      if(selected.size===PEOPLE.length)selected=new Set([p.id]);
      else if(selected.has(p.id))selected.delete(p.id);
      else selected.add(p.id);
      if(!selected.size)selected=new Set(PEOPLE.map(q=>q.id));
      update();
    };
  }
}

function renderMap(){
  const g=document.getElementById("markers");g.textContent="";
  for(const a of ARENAS){
    const {who,state}=status(a);
    const m=el("svg:g",{class:"mk "+state,tabindex:0},g);
    el("svg:title",{},m,`${a.team} · ${a.venue}, ${a.city}`+(who.length?` — visited by ${joinNames(who)}`:""));
    if(a.lx!=null)el("svg:line",{x1:a.cx,y1:a.cy,x2:a.lx,y2:a.ly,class:"lead"},m);
    el("svg:circle",{cx:a.cx,cy:a.cy,r:2.6,class:"dot"},m);
    const bx=a.px+17,by=a.py+9;
    el("svg:circle",{cx:bx,cy:by,r:13,class:"badge"},m);
    el("svg:image",{href:logo(a),x:bx-10,y:by-10,width:20,height:20,class:"logo"},m);
    if(who.length&&selected.size>1){
      const w=el("svg:g",{class:"who"},m),step=6.5,x0=a.px+17-(who.length-1)*step/2;
      who.forEach((p,i)=>el("svg:circle",{cx:x0+i*step,cy:a.py+24,r:2.9,style:`fill:${color(p)}`},w));
    }
  }
}

function li(a,ul){
  const {who,state}=status(a);
  const row=el("li",{class:state},ul);
  const c=el("span",{class:"c"},row);el("img",{src:logo(a),alt:"",loading:"lazy"},c);c.append(a.code);
  const t=el("span",{class:"t"},row,a.team);el("small",{},t,`${a.venue} · ${a.city}`);
  if(who.length&&selected.size>1){const d=el("span",{class:"ppl"},row);who.forEach(p=>el("b",{style:`--c:${color(p)}`,title:p.name},d,p.name[0]))}
}
function renderLists(){
  const box=document.getElementById("lists");box.textContent="";
  const many=selected.size>1,ps=sel();
  const groups=[
    {state:"all",title:many?(selected.size===PEOPLE.length?"Everyone's been":"All of "+joinNames(ps)):"Visited"},
    ...(many?[{state:"some",title:"Some of them"}]:[]),
    {state:"none",title:"Still to go"},
  ];
  for(const gr of groups){
    const items=ARENAS.filter(a=>status(a).state===gr.state);
    const s=el("section",{},box);el("h2",{},s,`${gr.title} · ${items.length}`);
    const ul=el("ul",{},s);items.forEach(a=>li(a,ul));
    if(!items.length)el("li",{class:"empty"},ul,"None yet");
  }
}

function renderScore(){
  const st=ARENAS.map(a=>status(a).state).sort((x,y)=>"all some none".indexOf(x)-"all some none".indexOf(y));
  document.getElementById("count").textContent=st.filter(s=>s==="all").length;
  const ps=sel();
  document.getElementById("scope").textContent=ps.length===PEOPLE.length?"visited by everyone":ps.length===1?"visited by "+ps[0].name:"visited by all of "+joinNames(ps);
  const t=document.getElementById("ticks");t.textContent="";
  st.forEach(s=>el("span",{class:"tick"+(s==="all"?" on":s==="some"?" some":"")},t));
}
function renderLegend(){
  const l=document.getElementById("legend");l.textContent="";
  const many=selected.size>1;
  const item=(cls,txt)=>{const s=el("span",{},l);el("i",{class:cls},s);s.append(txt)};
  item("all",many?"Visited by all selected":"Visited");
  if(many)item("some","Visited by some");
  item("","Still to go");
  if(many)for(const p of sel()){const s=el("span",{},l);el("span",{class:"pd",style:`--c:${color(p)}`},s);s.append(p.name)}
}
function update(){writeHash();renderChips();renderScore();renderMap();renderLegend();renderLists()}
addEventListener("hashchange",()=>{readHash();renderChips();renderScore();renderMap();renderLegend();renderLists()});
readHash();update();
</script>
</body>
